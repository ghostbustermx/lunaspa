; Pool de php-fpm para el contenedor "web".
;
; Sustituye al www.conf que trae la imagen oficial. El cambio importante es
; clear_env = no: por defecto php-fpm borra el entorno de los workers, y como
; docker-compose pasa la configuracion de CodeIgniter por variables de entorno
; (CI_ENVIRONMENT, database.default.*, app.baseURL...), con clear_env=yes
; getenv() devolveria false y la aplicacion intentaria conectarse a MySQL en
; 127.0.0.1 sin usuario, sin usuario y sin contrasena.
;
; Nginx corre en el mismo contenedor y le habla por 127.0.0.1:9000, asi que no
; hace falta abrir ningun socket ni volumen extra.

[www]

user = www-data
group = www-data

listen = 127.0.0.1:9000

; Cada peticion que atraviesa CodeIgniter puede acabar en MySQL, asi que el
; limite de scripts en paralelo tiene que ser holgado. pm = dynamic con
; start_dynamic por defecto cubre un sitio pequeno sin crecer en memoria.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 6
pm.max_requests = 500

clear_env = no

; El panel sube fotos de hasta 8 MB y CodeIgniter avisa con un mensaje claro
; cuando se excede. Un limite menor aqui produciria un 500 sin explicacion.
request_terminate_timeout = 60s

catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; Solo se acepta trafico de nginx, que esta en el mismo contenedor.
security.limit_extensions = .php
