; Ajustes de PHP para produccion. Se carga como /usr/local/etc/php/conf.d/zz-lunaspa.ini,
; que es el ultimo fichero del directorio de scan, de modo que gana sobre los
; valores por defecto de la imagen oficial.

[PHP]
; ---------------------------------------------------------------- general
; Los errores nunca se muestran al visitante: en produccion los registra
; CodeIgniter y devuelve una pagina 500 generica. Mostrarlos filtraria rutas,
; nombres de tabla y consultas SQL.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
expose_php = Off

memory_limit = 256M
max_execution_time = 60
default_charset = "UTF-8"
date.timezone = UTC

; ------------------------------------------------------------------ subida
; App\Libraries\ImageUpload acepta hasta 8 MB. post_max_size va un poco por
; encima para que, si se excede, PHP reporte el error de tamaño en lugar de
; descartar la peticion entera.
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10
file_uploads = On

; ----------------------------------------------------------------- sesion
; El dashboard usa sesiones en archivo (writable/session). La cookie de
; sesion va solo por HTTPS porque el sitio se sirve desde Nginx Proxy Manager.
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 7200
session.sid_length = 48

; Si se prueba la web por HTTP plano (no por el dominio HTTPS), la cookie Secure
; no se guarda y el login del panel parece fallar sin explicacion. Se puede
; relajar con PHP_INI_OVERRIDES, que el entrypoint escribe en conf.d.
;
;   PHP_INI_OVERRIDES="session.cookie_secure = 0" docker compose up -d

; ---------------------------------------------------------------- opcache
; El contenedor no cambia de codigo entre arranques, asi que no hace falta
; revalidar sellos: se ahorra una llamada al sistema de ficheros por peticion.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
