# nginx del contenedor "web": sirve la SPA y pasa a PHP lo que es de la API y
# del dashboard. Todo vive en un unico dominio, asi que no hay CORS y las
# cookies del panel no cruzan subdominios.
#
# Nginx Proxy Manager hace de proxy inverso y termina el TLS: aqui solo se
# escucha HTTP en el puerto 80 de la red interna.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El TLS lo termina Nginx Proxy Manager, asi que PHP-FPM solo ve HTTP y
    # CodeIgniter creeria estar en http://. Con la cookie de sesion marcada como
    # secure eso es un 500 en cada peticion del panel: "Attempted to send a
    # secure cookie over a non-secure connection". Por eso las locations de PHP
    # pasan HTTPS=on, que es lo que lee IncomingRequest::isSecure().
    #
    # No se intenta resolver con app.proxyIPs: CodeIgniter compara la IP remota
    # con esa lista usando inet_pton(), que no entiende comodines, y "*" no
    # marca a nadie como proxy de confianza.
    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" xff="$http_x_forwarded_for" '
                      'xfp="$http_x_forwarded_proto"';

    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout  65;

    # El limite real de subida lo impone App\Libraries\ImageUpload (8 MB).
    # Aqui se deja margen para el multipart del formulario.
    client_max_body_size  10M;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    server {
        listen      80 default_server;
        server_name _;

        # Raiz de la SPA (build de Vite).
        root  /var/www/html;
        index index.html;

        # ---------------------------------------------------------------
        # Rutas del backend, servidas desde el docroot de CodeIgniter.
        #
        # Estas dos van ANTES del bloque generico de /assets/ porque el
        # build de Vite tambien publica en /assets/ y la colision es real:
        #
        #   /assets/dashboard/... -> public/assets/dashboard/dashboard.css
        #                             (base_url() en app/Views/dashboard/layout.php)
        #   /assets/...           -> SPA (JS y CSS con hash en el nombre)
        #
        # El prefijo "dashboard" es lo que las separa. Si alguna vez el panel
        # usara otra carpeta bajo /assets/, hay que moverla aqui antes.
        # ---------------------------------------------------------------

        location ^~ /assets/dashboard/ {
            root        /var/www/backend/public;
            expires     7d;
            access_log  off;
            try_files   $uri =404;
        }

        # Imagenes de articulos: ImageUpload::url() devuelve
        # base_url('uploads/blog/<archivo>').
        location ^~ /uploads/ {
            root        /var/www/backend/public;
            expires     30d;
            access_log  off;
            try_files   $uri =404;
        }

        # ---------------------------------------------------------------
        # API y dashboard: todo lo que deba pasar por CodeIgniter.
        #
        # Se apunta SCRIPT_NAME a /index.php porque ese es el front controller
        # real. CodeIgniter deduce la ruta de REQUEST_URI quitando SCRIPT_NAME
        # (system/HTTP/SiteURIFactory.php), asi que con esto /api/reviews llega
        # como la ruta "api/reviews" sin depender de reglas de reescritura, que
        # es justo lo que fallaba con el RewriteBase de Apache.
        # ---------------------------------------------------------------

        location ^~ /api {
            include       fastcgi_params;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME  /var/www/backend/public/index.php;
            fastcgi_param SCRIPT_NAME      /index.php;
            fastcgi_param DOCUMENT_ROOT    /var/www/backend/public;
            fastcgi_param HTTPS            on;
            fastcgi_read_timeout 60s;
        }

        location ^~ /dashboard {
            include       fastcgi_params;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME  /var/www/backend/public/index.php;
            fastcgi_param SCRIPT_NAME      /index.php;
            fastcgi_param DOCUMENT_ROOT    /var/www/backend/public;
            fastcgi_param HTTPS            on;
            fastcgi_read_timeout 60s;
        }

        # ---------------------------------------------------------------
        # Archivos estaticos del build.
        # ---------------------------------------------------------------

        # El nombre lleva hash, asi que se puede cachear para siempre.
        location ^~ /assets/ {
            expires    1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # Vite copia public/ a dist/, incluido el .htaccess de Apache. Este
        # contenedor no lo necesita y no debe servirse.
        location ~ /\.ht {
            deny all;
            access_log off;
        }

        # .well-known si se sirve: ahi viven los archivos de verificacion de
        # buscadores y de alojamiento.
        location ^~ /.well-known/ {
            try_files $uri =404;
        }

        # ---------------------------------------------------------------
        # SPA. React Router usa /reviews, /reviews-score, /wellness-guide y
        # /blog/:slug, que no existen como archivo: cualquier ruta desconocida
        # devuelve index.html y el router decide.
        # ---------------------------------------------------------------

        location / {
            add_header Cache-Control "no-cache";
            try_files  $uri $uri/ /index.html;
        }

        # nginx nunca debe listar un directorio.
        autoindex off;
    }
}
